name: JARVIS Android Cloud Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify and prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME is not configured on the GitHub runner}"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "ERROR: Android sdkmanager was not found on the runner."
            exit 1
          fi

          # `yes` exits non-zero with a broken pipe once sdkmanager stops reading
          # (pipefail would fail the step); the install + android.jar checks below
          # still verify the platform really got installed.
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36.1" "build-tools;36.0.0"

          test -f "${ANDROID_HOME}/platforms/android-36.1/android.jar"
          echo "Android SDK platform 36.1 is available."
          "$SDKMANAGER" --list_installed | grep -E 'platforms;android-36.1|build-tools;36.0.0'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Show build toolchain
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Run debug unit tests
        run: gradle --no-daemon --stacktrace --console=plain :app:testDebugUnitTest

      - name: Run Android lint
        if: always() && !cancelled()
        run: gradle --no-daemon --stacktrace --console=plain :app:lintDebug

      - name: Build debug APK
        if: always() && !cancelled()
        run: gradle --no-daemon --stacktrace --console=plain :app:assembleDebug

      - name: Upload debug APK
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test and lint reports
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-build-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 14
